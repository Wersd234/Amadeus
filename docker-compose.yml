version: '3.8'

services:
  amadeus-bot:
    build: .
    container_name: amadeus_bot
    restart: unless-stopped
    # Allow container to reach host's llama-server via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gemma-4-novelist-31b}
      - LLM_CTX_SIZE=${LLM_CTX_SIZE:-32768}
      - PTV_DEVELOPER_ID=${PTV_DEVELOPER_ID:-}
      - PTV_API_KEY=${PTV_API_KEY:-}
      - WORLDLINE_REFRESH_HOURS=${WORLDLINE_REFRESH_HOURS:-6}
      - DMAIL_SHIFT_PROB=${DMAIL_SHIFT_PROB:-0.2}
    volumes:
      # Mount the entire data directory for atomic-write safety
      - ./data:/app/data